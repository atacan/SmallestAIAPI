minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: trufflehog
        name: Detect active or unverifiable secrets with TruffleHog
        # pre-commit supplies staged files and temporarily stashes unstaged edits.
        entry: trufflehog filesystem --results=verified,unknown --fail --fail-on-scan-errors --no-update --github-actions
        language: system
        types: [file]
        require_serial: true

