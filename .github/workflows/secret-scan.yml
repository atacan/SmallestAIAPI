name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all fetched Git history with Betterleaks
        env:
          BETTERLEAKS_VERSION: '1.9.0'
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/betterleaks.tar.gz"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          "$RUNNER_TEMP/betterleaks" git . --log-opts="--all --full-history" --redact --verbose

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the checked-out branch's full history with TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: '3.97.9'
          # An explicit head prevents the action from limiting scans to new commits.
          base: ''
          head: HEAD
          extra_args: --results=verified,unknown --fail-on-scan-errors

